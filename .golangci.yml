version: "2"

run:
  # Temporarily override the Go version to bypass the version mismatch
  # between the project (Go 1.27) and the linter's build version.
  go: "1.26"

formatters:
  enable:
    # gofmt: Ensures code is formatted as per gofmt.
    - gofmt
    # goimports: Ensures code is formatted as per goimports.
    - goimports

linters:
  disable-all: true
  enable:
    # --- Default Linters ---
    # errcheck: Checks that you handled errors.
    - errcheck
    # govet: Reports suspicious constructs, such as Printf calls whose arguments do not align with the format string.
    - govet
    # ineffassign: Detects when assignments to existing variables are not used.
    - ineffassign
    # staticcheck: A set of core linter rules from staticcheck.io.
    - staticcheck
    # unused: Checks Go code for unused constants, variables, functions and types.
    - unused

    # --- Code Style & Formatting ---
    # wsl: Ensures code has space/blank lines at correct places to increase readability.
    - wsl_v5
    # whitespace: Detects trailing spaces and tabs.
    - whitespace
    # misspell: Detects commonly misspelled English words.
    - misspell

    # --- Bug Detection & Correctness ---
    # noctx: Detects context.Context misuse.
    - noctx
    # durationcheck: Detects common mistakes involving time.Duration.
    - durationcheck
    # sqlclosecheck: Detects deferred Close() calls on sql.Rows.
    - sqlclosecheck
    # bodyclose: Detects missing defer resp.Body.Close() on http.Response.Body.
    - bodyclose
    # rowserrcheck: Detects when sql.Rows.Err() is not checked.
    - rowserrcheck
    # unconvert: Detects redundant type conversions.
    - unconvert
    # thelper: Detects when a test helper is not marked with a t.Helper() call.
    - thelper
    # usestdlibvars: Detects the possibility to use variables/constants from the Go standard library instead of custom ones.
    - usestdlibvars
    # errname: Checks that sentinel errors are prefixed with the `Err` and error types are suffixed with the `Error`.
    - errname

    # --- Best Practices & Security ---
    # gosec: Inspects source code for security problems.
    - gosec
    # gocritic: Provides many excellent bug, performance, and style checks.
    - gocritic
    # revive: A fast, configurable drop-in replacement for the deprecated golint.
    - revive

    # --- Logging ---
    # sloglint: Enforces best practices for standard library structured logging (slog).
    - sloglint

linters-settings:
  sloglint:
    # Enforce using key-value pairs only (overridden by attr-only)
    kv-only: false
    # Enforce using attributes only (slog.Attr)
    attr-only: true
    # Enforce not mixing key-value pairs and attributes
    no-mixed-args: true
    # Enforce passing context to log calls (all, scope, empty to disable)
    context: "all"
    # Enforce using static strings for log messages
    static-msg: true
    # Enforce not using global loggers
    no-global: "all"
    # Prevent using keys that conflict with standard log attributes
    forbidden-keys:
      - time
      - level
      - msg
      - source
