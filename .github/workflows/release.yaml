name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: pushkar-anand/.github/.github/workflows/go-release.yml@main
    with:
      image-name: jocasta
