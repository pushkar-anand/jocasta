site_name: Jocasta
site_description: A network inventory that keys each device by its hardware address.
site_url: https://pushkar-anand.github.io/jocasta/
repo_url: https://github.com/pushkar-anand/jocasta
repo_name: pushkar-anand/jocasta
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

nav:
  - index.md
  - Get started:
      - tutorial.md
      - concepts.md
      - ui.md
      - install.md
      - configuration.md
  - Devices:
      - devices.md
      - naming.md
      - classification.md
  - Plugins:
      - plugins/index.md
      - Routers:
          - plugins/routeros.md
          - plugins/openwrt.md
          - plugins/topology.md
      - plugins/netflow.md
      - DNS resolvers:
          - plugins/dns.md
          - plugins/technitium.md
          - plugins/pihole.md
          - plugins/adguard.md
  - Notifications:
      - notifications/index.md
      - notifications/watch.md
      - notifications/webhook.md
      - notifications/other-services.md
  - Integrations:
      - integrations/mcp.md
      - integrations/api.md
  - Operate:
      - operate/users.md
      - operate/https.md
      - operate/backup.md
      - operate/upgrading.md
      - operate/troubleshooting.md
  - Reference:
      - reference/configuration.md
      - cli.md
      - changelog.md
  - development.md

theme:
  name: material
  features:
    - content.action.copy
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # The changelog includes docs/releases/<major.minor>.md under each minor
  # release; a release with no such file has no highlights.
  - pymdownx.snippets:
      check_paths: false

plugins:
  - search
  # setup.md and mcp.md stay in the repository so links from older releases
  # resolve on GitHub; on the site, the redirects below stand in for them.
  # screenshots/ is a local, gitignored working directory.
  - exclude:
      glob:
        - setup.md
        - mcp.md
        - screenshots/*
        - releases/*
  - redirects:
      redirect_maps:
        setup.md: install.md
        mcp.md: integrations/mcp.md
  - llmstxt:
      # The docs workflow sets DOCS_BASE_URL to the version being deployed,
      # so each version's llms.txt links to its own pages.
      base_url: !ENV [DOCS_BASE_URL, "https://pushkar-anand.github.io/jocasta/"]
      full_output: llms-full.txt
      markdown_description: >-
        Jocasta is a single-binary network inventory with a web UI, a JSON API
        and an MCP server. Configuration is a YAML file or JOCASTA_ environment
        variables; the configuration reference lists every setting.
      sections:
        Get started:
          - index.md
          - tutorial.md
          - concepts.md
          - ui.md
          - install.md
          - configuration.md
        Devices:
          - devices.md
          - naming.md
          - classification.md
        Plugins:
          - plugins/index.md
          - plugins/routeros.md
          - plugins/openwrt.md
          - plugins/topology.md
          - plugins/netflow.md
          - plugins/dns.md
          - plugins/technitium.md
          - plugins/pihole.md
          - plugins/adguard.md
        Notifications:
          - notifications/index.md
          - notifications/watch.md
          - notifications/webhook.md
          - notifications/other-services.md
        Integrations:
          - integrations/mcp.md
          - integrations/api.md
        Operate:
          - operate/users.md
          - operate/https.md
          - operate/backup.md
          - operate/upgrading.md
          - operate/troubleshooting.md
        Reference:
          - reference/configuration.md
          - cli.md
        Development:
          - development.md
