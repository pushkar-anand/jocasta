# Every jocasta setting, shown with its default value.
#
# Copy the parts you want to change into jocasta.yaml. Settings you leave out
# keep their default. Any setting can also be set from the environment:
# JOCASTA_ followed by the path, with a double underscore between levels, for example
# JOCASTA_SCAN__DEVICES__INTERVAL=10m.

server:
  host: "localhost"       # 0.0.0.0 to listen on every interface
  port: 8080
  cors:
    allowed_origins: []   # browser origins besides the server's own that may read /api
  auth:
    session_lifetime: "168h"  # longest a sign-in lasts, regardless of activity
    idle_timeout: "24h"       # how long a session survives with no requests
    cookie_secure: true       # HTTPS-only session cookie; false to sign in over plain HTTP
  mcp:
    enabled: false        # serve the MCP endpoint at /mcp; see docs/mcp.md

db:
  path: "."               # directory the SQLite file lives in
  name: "jocasta.db"

logger:
  level: "info"           # debug | info | warn | error
  format: "json"          # text | json

inventory:
  online_window: "15m"    # how long after its last sighting a device counts as online
  address_grace: "6h"     # how long an address can go unseen before a later sweep retires it

# How long records are kept; "0s" keeps that kind forever. Devices are never
# pruned.
retention:
  history: "2160h"        # events and scans
  traffic: "720h"         # hourly traffic totals

# Where the network is.
location:
  country: ""             # two-letter code the world map draws lines from, such as "AU";
                          # blank uses the router's outside address, which cannot
                          # place a network behind the ISP's CGNAT
  timezone: ""            # IANA zone times are shown in, such as "Australia/Sydney";
                          # blank uses TZ or the system's, which is UTC in a container

# Segments the poller sweeps on a timer. Also used to match each discovered
# address to the network that contains it. Empty by default; this is an example.
networks:
  - "192.0.2.0/24"

scan:
  source: ""              # origin recorded for timed sweeps; defaults to "sweep:<hostname>"
  devices:
    enabled: true
    interval: "5m"
    rate: 1000            # max ICMP probes per second
    rounds: 2             # probes per address before calling it down
    wait: "2s"            # how long to wait for replies after the last probe
    resolve_names: true   # reverse DNS on addresses that answered
    resolve_macs: true    # read the neighbour table for hardware addresses
  ports:
    enabled: false
    interval: "6h"
    custom: ""            # ports to probe, such as "22,80,443,8000-8100"; blank uses a curated preset
    concurrency: 64       # max connections a scan opens at once; lower it on a cheap router

# Sources beyond the sweep. None are configured by default; the block below is
# an example instance. Each block is keyed by an instance name,
# which becomes the source its facts are filed under, so two routers stay
# separate.
plugins:
  routeros:
    gateway:
      enabled: true
      host: "192.0.2.1"
      port: 443
      user: "jocasta"
      password: "change-me"   # a read-only RouterOS user is enough
      ssl: true
      insecure: true          # RouterOS serves a self-signed cert unless you import one
      timeout: "15s"
  netflow:
    gateway:
      enabled: true
      listen: ":2055"         # UDP address the router exports flows to
      exporters:              # only these may send; UDP is trivially spoofed
        - "192.0.2.1"

# Where changes are sent. None are configured by default; the entries below
# are examples. Each is keyed by a name and holds one service block. Each
# finished scan is sent as one message, and which changes a destination
# receives is picked in Settings → Notifications.
notify:
  phone:
    ntfy:
      url: "https://ntfy.example.com/jocasta"   # the topic's address, as ntfy shows it
      token: ""                                 # for a server that requires one
      priority: 0                               # 1 (min) to 5 (max); 0 leaves it to the server
  automation:
    enabled: false                              # on unless set to false
    timeout: "10s"                              # the longest one send may take
    webhook:
      url: "https://hooks.example.com/jocasta"
      secret: "change-me"                       # signs each request; required
